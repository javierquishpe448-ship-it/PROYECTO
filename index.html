<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROYECTO DE GRADO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0B1220;
color:white;
min-height:100vh;
padding:30px;
}

header{
text-align:center;
margin-bottom:40px;
}

header h1{
font-size:3rem;
}

header h2{
margin-top:10px;
font-size:1.2rem;
color:#94A3B8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
}

.h1{
background:linear-gradient(135deg,#2563EB,#1D4ED8);
}

.h2{
background:linear-gradient(135deg,#9333EA,#7E22CE);
}

.h3{
background:linear-gradient(135deg,#16A34A,#15803D);
}

.estado{
margin:20px 0;
font-size:1.2rem;
font-weight:bold;
}

.led{
width:18px;
height:18px;
border-radius:50%;
display:inline-block;
background:red;
box-shadow:0 0 15px red;
margin-right:10px;
}

.encendido{
background:#00ff88 !important;
box-shadow:0 0 25px #00ff88 !important;
}

.botones{
display:flex;
gap:10px;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.btnOn{
background:white;
}

.btnOff{
background:#111827;
color:white;
}

footer{
position:fixed;
bottom:20px;
left:20px;
font-size:.9rem;
color:#94A3B8;
}

</style>
</head>

<body>

<header>
<h1>PROYECTO DE GRADO</h1>
<h2>BY: JAVIER QUISHPE & JOHANNA SINCHIGUANO</h2>
</header>

<div class="grid">

<div class="card h1">

<h2>🏠 SECCIÓN 1</h2>

<div class="estado">
<span id="led1" class="led"></span>
<span id="texto1">APAGADO</span>
</div>

<div class="botones">
<button class="btnOn" onclick="control('foco1',1)">ENCENDER</button>
<button class="btnOff" onclick="control('foco1',0)">APAGAR</button>
</div>

</div>

<div class="card h2">

<h2>🏠 SECCIÓN 2</h2>

<div class="estado">
<span id="led2" class="led"></span>
<span id="texto2">APAGADO</span>
</div>

<div class="botones">
<button class="btnOn" onclick="control('foco2',1)">ENCENDER</button>
<button class="btnOff" onclick="control('foco2',0)">APAGAR</button>
</div>

</div>

<div class="card h3">

<h2>🏠 SECCIÓN 3</h2>

<div class="estado">
<span id="led3" class="led"></span>
<span id="texto3">APAGADO</span>
</div>

<div class="botones">
<button class="btnOn" onclick="control('foco3',1)">ENCENDER</button>
<button class="btnOff" onclick="control('foco3',0)">APAGAR</button>
</div>

</div>

</div>

<footer>

PROYECTO IoT<br>
UNIDAD EDUCATIVA BENITO JUÁREZ<br>
APLICACIONES INFORMÁTICAS

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {

    apiKey: "AIzaSyDcHPhw7uY1ZfM50qBww-DiFIBoGcObOkU",
    authDomain: "controliluminacionesp32.firebaseapp.com",
    databaseURL: "https://controliluminacionesp32-default-rtdb.firebaseio.com",
    projectId: "controliluminacionesp32",
    storageBucket: "controliluminacionesp32.firebasestorage.app",
    messagingSenderId: "669356047030",
    appId: "1:669356047030:web:e137d7cd3b2b489009c417"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.control = function(foco,estado)
{
set(ref(db,foco),estado);
}

function actualizar(ruta,led,texto)
{
onValue(ref(db,ruta),(snapshot)=>{

if(snapshot.val()==1)
{
document.getElementById(led).classList.add("encendido");
document.getElementById(texto).innerHTML="ENCENDIDO";
}
else
{
document.getElementById(led).classList.remove("encendido");
document.getElementById(texto).innerHTML="APAGADO";
}

});
}

actualizar("foco1","led1","texto1");
actualizar("foco2","led2","texto2");
actualizar("foco3","led3","texto3");

</script>

</body>
</html>
